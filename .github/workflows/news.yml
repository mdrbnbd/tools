name: Update news
on:
  schedule:
    - cron: '*/20 * * * *'   # every 20 minutes
  workflow_dispatch:
permissions:
  contents: write
concurrency: { group: news, cancel-in-progress: false }
jobs:
  news:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python3 scripts/fetch_news.py
      - name: Commit news.json if changed
        run: |
          git config user.name "dfaster-news-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add news.json
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git commit -m "news: update $(date -u +%FT%TZ)"
          for i in 1 2 3; do git pull --rebase -X theirs origin main && git push && exit 0; sleep 5; done
          exit 1
