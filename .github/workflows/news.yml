name: Update news
on:
  schedule:
    - cron: '17 */2 * * *'   # every 2 hours
  workflow_dispatch:
permissions:
  contents: write
concurrency: { group: news, cancel-in-progress: false }
jobs:
  news:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python3 scripts/fetch_news.py
      - name: Commit news.json if changed
        run: |
          git config user.name "dfaster-news-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add news.json
          if git diff --cached --quiet; then echo "no change"; else git commit -m "news: update $(date -u +%FT%TZ)" && git push; fi
